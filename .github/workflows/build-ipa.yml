# 一键打包 iOS 免签名 IPA（GitHub Actions · macOS Runner）
# 用法：Actions → build-ipa → Run workflow → 完成后下载 shiguangyuyue-ipa 工件
name: build-ipa

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 组装 www 网页资源
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js css js icons www/

      - name: 确认 CocoaPods 可用
        run: which pod || sudo gem install cocoapods --no-document

      - name: 生成并同步 Capacitor iOS 工程（时光屿月）
        run: |
          rm -rf ios
          npx cap add ios || true
          npx cap sync ios
          grep -n "CFBundleDisplayName" ios/App/App/Info.plist || true

      - name: 用指定图片替换 iOS 应用图标（全套 AppIcon 尺寸）
        run: |
          APPICON="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          ls "$APPICON"
          node tools/apply-ios-icon.mjs "$APPICON" "icons/app-1024.png"

      - name: 启动屏背景改深色（消除粉红/白闪，与品牌启动动画一致）
        run: |
          python3 -c "
          import re
          p = 'ios/App/App/Base.lproj/LaunchScreen.storyboard'
          with open(p, 'r', encoding='utf-8') as f: c = f.read()
          c = re.sub(r'<color key=\"backgroundColor\"[^/]*/>', '<color key=\"backgroundColor\" red=\"0.050980392156862744\" green=\"0.054901960784313725\" blue=\"0.07058823529411765\" alpha=\"1\" colorSpace=\"custom\" customColorSpace=\"sRGB\"/>', c)
          with open(p, 'w', encoding='utf-8') as f: f.write(c)
          print('LaunchScreen backgroundColor -> #0d0e12')
          "

      - name: 设置原生控件为中文（日期选择器/系统按钮跟随中文区域）
        run: |
          python3 -c "
          import plistlib
          p = 'ios/App/App/Info.plist'
          with open(p, 'rb') as f: d = plistlib.load(f)
          d['CFBundleDevelopmentRegion'] = 'zh_CN'
          d['CFBundleLocalizations'] = ['zh_CN']
          with open(p, 'wb') as f: plistlib.dump(d, f)
          print('Info.plist CFBundleDevelopmentRegion -> zh_CN')
          "

      - name: 无签名编译 Debug App（真机 SDK）
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: 组装免签名 IPA（Payload 结构）
        run: |
          cd ios/App/build/Build/Products/Debug-iphoneos
          rm -rf Payload shiguangyuyue-unsigned.ipa
          mkdir -p Payload
          cp -R App.app Payload/
          zip -qry shiguangyuyue-unsigned.ipa Payload
          ls -lh shiguangyuyue-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v5
        with:
          name: shiguangyuyue-ipa
          path: ios/App/build/Build/Products/Debug-iphoneos/shiguangyuyue-unsigned.ipa
          if-no-files-found: error
