# 一键打包安卓 APK（GitHub Actions）
# 用法：仓库 Actions 页 → build-apk → Run workflow → 等待完成后下载 app-debug.apk
name: build-apk

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 组装 www 网页资源
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js css js icons www/

      - name: 安装安卓 SDK
        uses: android-actions/setup-android@v3

      - name: 添加并同步 Capacitor 安卓工程（先清空，避免旧工程残留旧应用名）
        run: |
          rm -rf android
          npx cap add android || true
          npx cap sync android
          # 强制写入应用名「时光屿月」（兜底，防止模板/残留不一致）
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">时光屿月</string>|' android/app/src/main/res/values/strings.xml || true
          grep -n 'app_name' android/app/src/main/res/values/strings.xml

      - name: 应用安卓应用图标（仓库内预生成的 android-res 覆盖模板图标）
        run: cp -r android-res/. android/app/src/main/res/

      - name: 编译 Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: 上传 APK
        uses: actions/upload-artifact@v5
        with:
          name: daoshuri-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
