# 涓€閿墦鍖呭畨鍗?APK锛圙itHub Actions锛?# 鐢ㄦ硶锛氫粨搴?Actions 椤?鈫?build-apk 鈫?Run workflow 鈫?绛夊緟瀹屾垚鍚庝笅杞?app-debug.apk
name: build-apk

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v5

      - name: 瀹夎 Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: 瀹夎渚濊禆
        run: npm install

      - name: 缁勮 www 缃戦〉璧勬簮
        run: |
          mkdir -p www
          cp -r index.html manifest.webmanifest sw.js css js icons www/

      - name: 瀹夎瀹夊崜 SDK
        uses: android-actions/setup-android@v3

      - name: 娣诲姞骞跺悓姝?Capacitor 瀹夊崜宸ョ▼锛堝厛娓呯┖锛岄伩鍏嶆棫宸ョ▼娈嬬暀鏃у簲鐢ㄥ悕锛?        run: |
          rm -rf android
          npx cap add android || true
          npx cap sync android
          # 寮哄埗鍐欏叆搴旂敤鍚嶃€屾椂鍏夊笨鏈堛€嶏紙鍏滃簳锛岄槻姝㈡ā鏉?娈嬬暀涓嶄竴鑷达級
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">鏃跺厜灞挎湀</string>|' android/app/src/main/res/values/strings.xml || true
          grep -n 'app_name' android/app/src/main/res/values/strings.xml

      - name: 搴旂敤瀹夊崜搴旂敤鍥炬爣锛堜粨搴撳唴棰勭敓鎴愮殑 android-res 瑕嗙洊妯℃澘鍥炬爣锛?        run: cp -r android-res/. android/app/src/main/res/

      - name: 缂栬瘧 Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: 涓婁紶 APK
        uses: actions/upload-artifact@v5
        with:
          name: daoshuri-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
