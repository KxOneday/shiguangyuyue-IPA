<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="时光屿月" />
  <meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="时光屿月：倒计时、纪念日、农历与生理周期记录" />
  <title>时光屿月</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/app.png" />
  <link rel="apple-touch-icon" href="icons/app.png" />
  <link rel="stylesheet" href="css/app.css?v=254" />
  <style>
    /* critical：外部 CSS 加载前立即铺底，避免白屏/粉红闪烁 */
    html, body { margin: 0; padding: 0; background: #f3f4f8; }
    @media (prefers-color-scheme: dark) { html, body { background: #0d0e12; } }
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(1200px 500px at 50% -8%, rgba(255,138,92,.12), transparent 60%),
        radial-gradient(900px 420px at 108% 8%, rgba(255,94,98,.10), transparent 55%),
        #0d0e12;
      transition: opacity .38s ease, transform .38s ease;
    }
    #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
    .splash-logo {
      width: 86px; height: 86px; border-radius: 26px;
      background: linear-gradient(135deg, #ffb066 0%, #ff6b8a 55%, #ff4d6d 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 14px 36px rgba(255,77,109,.38), inset 0 1px 0 rgba(255,255,255,.25);
      position: relative; overflow: hidden;
      animation: spIn .55s cubic-bezier(.2,.8,.2,1) both;
    }
    .splash-logo::before {
      content: ''; position: absolute; inset: -40%;
      background: conic-gradient(from 0deg, transparent 0 60%, rgba(255,255,255,.35) 70%, transparent 80% 100%);
      animation: spSpin 2.4s linear infinite;
    }
    .splash-logo::after {
      content: ''; position: absolute; inset: 3px; border-radius: 23px;
      background: linear-gradient(135deg, #ffb066, #ff4d6d);
    }
    .splash-logo > svg { position: relative; z-index: 1; width: 44px; height: 44px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.15)); }
    .splash-name {
      margin-top: 24px; font-size: 27px; font-weight: 600; letter-spacing: 6px;
      color: #eef0f5; animation: spIn .55s .08s cubic-bezier(.2,.8,.2,1) both;
    }
    .splash-sub {
      margin-top: 10px; font-size: 12.5px; color: #9aa1b0; letter-spacing: 2px;
      animation: spIn .55s .16s cubic-bezier(.2,.8,.2,1) both;
    }
    .splash-bar {
      margin-top: 28px; width: 120px; height: 3px; border-radius: 3px;
      background: rgba(255,255,255,.1); overflow: hidden;
      animation: spIn .55s .24s cubic-bezier(.2,.8,.2,1) both;
    }
    .splash-bar > i {
      display: block; height: 100%; width: 40%; border-radius: 3px;
      background: linear-gradient(90deg, #ff9a62, #ff4d6d);
      animation: spBar 1.1s ease-in-out infinite;
    }
    @keyframes spIn { from { opacity: 0; transform: translateY(12px) scale(.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes spSpin { to { transform: rotate(360deg); } }
    @keyframes spBar { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle>
        <path d="M12 7.5v5l3.2 2"></path>
        <path d="M9 2.5l1 2M15 2.5l-1 2"></path>
      </svg>
    </div>
    <div class="splash-name">时光屿月</div>
    <div class="splash-sub">记录每一个重要的日子</div>
    <div class="splash-bar"><i></i></div>
  </div>
  <div id="app">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-name" id="brandName">纪念日</span><span class="brand-date" id="brandDate"></span>
      </div>
      <div class="top-actions">
        <button id="btnSearch" class="iconbtn" type="button" title="搜索" aria-label="搜索"></button>
        <button id="btnCat" class="iconbtn" type="button" title="分类管理" aria-label="分类管理"></button>
        <button id="btnView" class="iconbtn" type="button" title="切换视图" aria-label="切换列表/日历"></button>
        <button id="btnMore" class="iconbtn" type="button" title="更多" aria-label="更多"></button>
        <button id="btnAdd" class="iconbtn add" type="button" title="新建事件" aria-label="新建事件"></button>
      </div>
    </header>

    <!-- 搜索 -->
    <div id="searchbar" class="searchbar" hidden>
      <input id="searchInput" type="search" placeholder="搜索事件名称 / 备注" autocomplete="off" />
      <button id="searchClear" type="button" class="iconbtn small" aria-label="关闭搜索"></button>
    </div>

    <!-- 纪念日页顶部面板：日期 + 分类（整体吸顶） -->
    <div class="headpanel" id="headPanel">
      <div class="todayline" id="todayline"></div>
      <nav class="chips" id="chips" aria-label="筛选"></nav>
    </div>

    <!-- 主内容：各页面 -->
    <main id="content" class="content"></main>
  </div>

  <!-- 底栏导航 -->
  <nav id="tabbar" class="tabbar" aria-label="主导航">
    <button type="button" class="tab" data-tab="home"><span class="tic"><svg data-ic="home" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></span><span class="tl">首页</span></button>
    <button type="button" class="tab" data-tab="list"><span class="tic"><svg data-ic="list" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></span><span class="tl">纪念日</span></button>
    <button type="button" class="tab" data-tab="cal"><span class="tic"><svg data-ic="cal" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></span><span class="tl">月历</span></button>
    <button type="button" class="tab" data-tab="set"><span class="tic"><svg data-ic="set" viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg></span><span class="tl">设置</span></button>
  </nav>

  <button id="fab" class="fab" type="button" aria-label="新建事件"></button>

  <!-- 弹层（动作表 / 编辑器 / 确认框共用） -->
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-mask" data-close="1"></div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- 隐藏文件选择 -->
  <input id="photoFile" type="file" accept="image/*" hidden />
  <input id="importFile" type="file" accept=".json,application/json" hidden />

  <script src="js/lunar.js?v=254"></script>
  <script src="js/core.js?v=254"></script>
  <script src="js/store.js?v=254"></script>
  <script src="js/notify.js?v=254"></script>
  <script src="js/ui.js?v=254"></script>
  <script src="js/app.js?v=254"></script>
  <script>
    /* 启动遮罩：资源就绪后最短展示 500ms，再优雅淡出 */
    (function () {
      function hide() {
        var s = document.getElementById('splash');
        if (!s) return;
        s.classList.add('hide');
        setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 420);
      }
      if (document.readyState === 'complete') {
        setTimeout(hide, 500);
      } else {
        window.addEventListener('load', function () { setTimeout(hide, 500); });
      }
    })();
  </script>
</body>
</html>
